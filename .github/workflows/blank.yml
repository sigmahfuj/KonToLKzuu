
name: Build Kernel 4.14 (Vanilla / BakaSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Target Defconfig File Name'
        required: true
        default: 'camellian_gl_defconfig'

      build_type:
        description: 'Select Kernel Build Type'
        required: true
        type: choice
        default: 'BakaSU'
        options:
          - Vanilla
          - BakaSU

      include_susfs:
        description: 'Enable BakaSU SUSFS (Requires Kernel-side SUSFS Backport)'
        required: true
        type: boolean
        default: false

      custom_dir:
        description: 'Custom Directory Inside Cloned Kernel Source'
        required: true
        default: './camellian-t-oss/'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            bison flex \
            bc git wget curl \
            zip dos2unix \
            python3

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 --single-branch \
            https://github.com/noonomyen/camellian-linux \
            -b master \
            kernel-source

      - name: Enter Custom Directory
        env:
          CUSTOM_DIR: ${{ inputs.custom_dir }}
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -e

          CUSTOM_DIR="${CUSTOM_DIR#./}"
          CUSTOM_DIR="${CUSTOM_DIR%/}"

          case "$CUSTOM_DIR" in
            ""|/*|..|../*|*/../*|*/..)
              echo "Invalid custom directory!"
              exit 1
              ;;
          esac

          KERNEL_DIR="$GITHUB_WORKSPACE/kernel-source/$CUSTOM_DIR"

          if [ ! -d "$KERNEL_DIR" ]; then
            echo "Custom directory not found!"
            exit 1
          fi

          if [ ! -f "$KERNEL_DIR/Makefile" ]; then
            echo "Kernel Makefile not found!"
            exit 1
          fi

          if [ ! -f "$KERNEL_DIR/arch/arm64/configs/$DEFCONFIG" ]; then
            echo "Defconfig not found!"
            exit 1
          fi

          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

          echo "Kernel directory: $KERNEL_DIR"

      - name: Setup BakaSU
        if: inputs.build_type == 'BakaSU'
        run: |
          set -e
          cd "$KERNEL_DIR"

          curl -LSs \
            "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" \
            -o "$RUNNER_TEMP/bakasu-setup.sh"

          bash "$RUNNER_TEMP/bakasu-setup.sh"

          echo "BakaSU setup completed!"

      - name: Configure BakaSU
        if: inputs.build_type == 'BakaSU'
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
          INCLUDE_SUSFS: ${{ inputs.include_susfs }}
        run: |
          set -e
          cd "$KERNEL_DIR"

          CONFIG_FILE="arch/arm64/configs/$DEFCONFIG"

          # Remove old BakaSU/KernelSU config entries
          sed -i \
            -e '/^CONFIG_KSU=/d' \
            -e '/^CONFIG_KSU_MANUAL_HOOK=/d' \
            -e '/^CONFIG_KSU_SUSFS=/d' \
            -e '/^CONFIG_KALLSYMS_ALL=/d' \
            -e '/^# CONFIG_KSU.* is not set$/d' \
            "$CONFIG_FILE"

          cat <<EOF >> "$CONFIG_FILE"
          CONFIG_KSU=y
          CONFIG_KALLSYMS_ALL=y
          EOF

          if [ "$INCLUDE_SUSFS" = "true" ]; then

            echo "Enabling BakaSU SUSFS mode"

            cat <<EOF >> "$CONFIG_FILE"
          CONFIG_KSU_SUSFS=y
          EOF

            if [ ! -f fs/susfs.c ] || [ ! -f include/linux/susfs.h ]; then
              echo "ERROR: Kernel-side SUSFS backport is missing!"
              echo "Please backport compatible SUSFS patches first."
              exit 1
            fi

          else

            echo "Enabling BakaSU Manual Hook mode"

            cat <<EOF >> "$CONFIG_FILE"
          CONFIG_KSU_MANUAL_HOOK=y
          EOF

          fi

          echo "BakaSU configuration completed!"

      - name: Download Proton-Clang Toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"

          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            "$GITHUB_WORKSPACE/toolchain/clang"

      - name: Setup GCC Toolchain
        run: |
          cd "$GITHUB_WORKSPACE/toolchain"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

      - name: Compile Kernel
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -e
          cd "$KERNEL_DIR"

          export KBUILD_BUILD_USER="root"
          export KBUILD_BUILD_HOST="root"

          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"

          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          export HOSTLD=/usr/bin/ld
          export HOSTAR=/usr/bin/ar

          echo "Generating Defconfig..."

          make O=out ARCH=arm64 "$DEFCONFIG"

          MAKE_ARGS=(
            -j"$(nproc --all)"
            O=out
            ARCH=arm64
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-android-
            CROSS_COMPILE_ARM32=arm-linux-androideabi-
          )

          echo "Starting Kernel Compilation..."

          make "${MAKE_ARGS[@]}" Image.gz-dtb dtbs modules

          echo "Kernel Compilation Completed!"

      - name: Collect Kernel Images, DTB & Modules
        run: |
          set -e

          OUT="$KERNEL_DIR/out"
          DEST="$GITHUB_WORKSPACE/kernel-artifacts"
          BOOT_DIR="$OUT/arch/arm64/boot"

          mkdir -p "$DEST/kernel"
          mkdir -p "$DEST/dtb"
          mkdir -p "$DEST/modules"
          mkdir -p "$DEST/other"

          if [ ! -d "$BOOT_DIR" ]; then
            echo "Kernel boot output directory not found!"
            exit 1
          fi

          # Collect Kernel Images
          find "$BOOT_DIR" -maxdepth 1 -type f \
            -name 'Image*' \
            -exec cp {} "$DEST/kernel/" \;

          # Collect DTB and DTBO
          find "$BOOT_DIR" -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp --parents {} "$DEST/dtb/" \;

          # Collect Kernel Modules
          find "$OUT" -type f -name '*.ko' \
            -exec cp --parents {} "$DEST/modules/" \;

          # Collect Additional Outputs
          for FILE in vmlinux System.map .config Module.symvers; do
            if [ -f "$OUT/$FILE" ]; then
              cp "$OUT/$FILE" "$DEST/other/"
            fi
          done

          if ! find "$DEST/kernel" -type f | grep -q .; then
            echo "No Kernel Image found!"
            exit 1
          fi

          echo "Collected Build Outputs:"
          find "$DEST" -type f

      - name: Upload Kernel Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-Kernel-BakaSU-${{ github.run_number }}
          path: kernel-artifacts/
          if-no-files-found: error
          retention-days: 14
