
name: Build Kernel 4.14 (Vanilla / KernelSU-Next)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Target Defconfig File Name"
        required: true
        default: "camellian_gl_defconfig"
        type: string

      build_type:
        description: "Kernel Build Type"
        required: true
        type: choice
        options:
          - Vanilla
          - KernelSU-Next
        default: KernelSU-Next

      include_susfs:
        description: "Include SUSFS (requires a compatible 4.14 patch)"
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Build Camellian Kernel
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: kernel-source
      DEFCONFIG: ${{ inputs.defconfig }}
      BUILD_TYPE: ${{ inputs.build_type }}
      INCLUDE_SUSFS: ${{ inputs.include_susfs }}

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget python3 \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            libncurses-dev dwarves \
            zip unzip lz4 zstd \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/rwxrx-rx/android_kernel_xiaomi_camellia.git \
            kernel-source

      - name: Setup Toolchains
        run: |
          mkdir -p toolchain
          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            toolchain/clang

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            toolchain/gcc64

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            toolchain/gcc32

      - name: Setup KernelSU-Next
        if: inputs.build_type == 'KernelSU-Next'
        working-directory: kernel-source
        run: |
          set -e

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          CONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Defconfig not found: $CONFIG_FILE"
            exit 1
          fi

          sed -i \
            -e '/^CONFIG_KSU=/d' \
            -e '/^CONFIG_KPROBES=/d' \
            -e '/^CONFIG_KPROBE_EVENTS=/d' \
            -e '/^CONFIG_KSU_KPROBE_HOOKS=/d' \
            "$CONFIG_FILE"

          cat >> "$CONFIG_FILE" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_KPROBE_HOOKS=y
          EOF

      - name: SUSFS Compatibility Check
        if: inputs.include_susfs == true
        working-directory: kernel-source
        run: |
          echo "Checking SUSFS 4.14 patch availability..."

          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            "$RUNNER_TEMP/susfs4ksu"

          find "$RUNNER_TEMP/susfs4ksu/kernel_patches" \
            -type f -iname '*4.14*.patch' -print

          PATCH_FILE="$(find "$RUNNER_TEMP/susfs4ksu/kernel_patches" \
            -type f -iname '*4.14*.patch' | head -n 1)"

          if [ -z "$PATCH_FILE" ]; then
            echo "::error::Compatible SUSFS 4.14 patch not found."
            echo "SUSFS was not applied. Check the current SUSFS patch layout."
            exit 1
          fi

          echo "Found patch: $PATCH_FILE"
          patch --dry-run -p1 < "$PATCH_FILE"
          patch -p1 < "$PATCH_FILE"

      - name: Configure Kernel
        working-directory: kernel-source
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"

          export KBUILD_BUILD_USER="root"
          export KBUILD_BUILD_HOST="github-actions"

          make O=out ARCH=arm64 "$DEFCONFIG"

          if [ "$BUILD_TYPE" = "KernelSU-Next" ]; then
            grep -E \
              'CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_KSU_KPROBE_HOOKS=' \
              out/.config || true
          fi

      - name: Build Kernel
        working-directory: kernel-source
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"

          export KBUILD_BUILD_USER="root"
          export KBUILD_BUILD_HOST="github-actions"

          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Collect Kernel Images
        working-directory: kernel-source
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/kernel-artifacts"

          find out/arch/arm64/boot -maxdepth 1 \
            -type f \( \
              -name 'Image' -o \
              -name 'Image.gz' -o \
              -name 'Image.gz-dtb' -o \
              -name '*.dtb' -o \
              -name '*.dtbo' \
            \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/kernel-artifacts/" \;

          if [ -z "$(ls -A "$GITHUB_WORKSPACE/kernel-artifacts")" ]; then
            echo "::error::No kernel image artifacts found."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/kernel-artifacts"

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-${{ inputs.build_type }}-Kernel
          path: kernel-artifacts/*
          if-no-files-found: error
