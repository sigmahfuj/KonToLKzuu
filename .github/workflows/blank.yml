
name: Build Kernel 4.14 (Vanilla / ReSuKISU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Target Defconfig File Name'
        required: true
        default: 'camellian_gl_defconfig'
        type: string

      build_type:
        description: 'Select Kernel Build Type'
        required: true
        type: choice
        default: 'ReSuKISU'
        options:
          - Vanilla
          - ReSuKISU

      include_susfs:
        description: 'Enable SUSFS (ReSuKISU only)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build Kernel Image
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Build Information
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          INCLUDE_SUSFS: ${{ inputs.include_susfs }}
        run: |
          set -e

          if [ "$BUILD_TYPE" = "ReSuKISU" ]; then
            if [ "$INCLUDE_SUSFS" = "true" ]; then
              echo "BUILD_TITLE=ReSuKISU + SUSFS" >> "$GITHUB_ENV"
            else
              echo "BUILD_TITLE=ReSuKISU" >> "$GITHUB_ENV"
            fi
          else
            echo "BUILD_TITLE=Vanilla" >> "$GITHUB_ENV"
          fi

          echo "Selected build: $BUILD_TYPE"
          echo "SUSFS enabled: $INCLUDE_SUSFS"

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            bc \
            git \
            wget \
            curl \
            zip \
            dos2unix \
            python3 \
            device-tree-compiler

      - name: Clone Kernel Source
        shell: bash
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/cristidclxvi/android_kernel_xiaomi_camellia \
            -b lineage-23.2 kernel-source

          cd kernel-source

          echo "Kernel source:"
          git log -1 --oneline

      - name: Validate Defconfig
        shell: bash
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -e

          CONFIG="kernel-source/arch/arm64/configs/$DEFCONFIG"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: Defconfig not found: $CONFIG"
            exit 1
          fi

          echo "Using defconfig: $DEFCONFIG"

      - name: Setup ReSuKISU
        if: inputs.build_type == 'ReSuKISU'
        shell: bash
        run: |
          set -e
          cd kernel-source

          git clone --depth=1 \
            https://github.com/ReSukiSU/ReSukiSU.git KernelSU

          if [ ! -d KernelSU/kernel ]; then
            echo "ERROR: KernelSU kernel directory not found!"
            exit 1
          fi

          mkdir -p drivers

          ln -sfn ../KernelSU/kernel drivers/KernelSU

          if ! grep -q 'drivers/KernelSU/' drivers/Makefile; then
            echo 'obj-y += KernelSU/' >> drivers/Makefile
          fi

          CONFIG_FILE="arch/arm64/configs/${{ inputs.defconfig }}"

          if ! grep -q '^CONFIG_KSU=' "$CONFIG_FILE"; then
            echo 'CONFIG_KSU=y' >> "$CONFIG_FILE"
          fi

          if ! grep -q '^CONFIG_KPROBES=' "$CONFIG_FILE"; then
            echo 'CONFIG_KPROBES=y' >> "$CONFIG_FILE"
          fi

          if ! grep -q '^CONFIG_HAVE_KPROBES=' "$CONFIG_FILE"; then
            echo 'CONFIG_HAVE_KPROBES=y' >> "$CONFIG_FILE"
          fi

          if ! grep -q '^CONFIG_KPROBE_EVENTS=' "$CONFIG_FILE"; then
            echo 'CONFIG_KPROBE_EVENTS=y' >> "$CONFIG_FILE"
          fi

          echo "ReSuKISU source prepared."

      - name: Setup SUSFS
        if: inputs.build_type == 'ReSuKISU' && inputs.include_susfs
        shell: bash
        run: |
          set -e
          cd kernel-source

          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            ../susfs4ksu

          SUSFS_DIR="../susfs4ksu/kernel_patches"

          if [ ! -f "$SUSFS_DIR/50_recipe_for_4.14.patch" ]; then
            echo "ERROR: SUSFS 4.14 patch not found!"
            exit 1
          fi

          if [ ! -f "$SUSFS_DIR/KernelSU/10_enable_susfs_for_ksu.patch" ]; then
            echo "ERROR: KernelSU SUSFS patch not found!"
            exit 1
          fi

          # Apply kernel SUSFS patch.
          patch --batch --forward -p1 \
            < "$SUSFS_DIR/50_recipe_for_4.14.patch"

          # Apply SUSFS integration patch to KernelSU.
          cd KernelSU

          patch --batch --forward -p1 \
            < "../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          cd ..

          CONFIG_FILE="arch/arm64/configs/${{ inputs.defconfig }}"

          cat >> "$CONFIG_FILE" <<'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF

          echo "SUSFS patches applied."

      - name: Download Proton-Clang Toolchain
        shell: bash
        run: |
          set -e

          mkdir -p toolchain/clang

          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            toolchain/clang

          if [ ! -x toolchain/clang/bin/clang ]; then
            echo "ERROR: Clang compiler not found!"
            exit 1
          fi

          toolchain/clang/bin/clang --version

      - name: Setup GCC Toolchains
        shell: bash
        run: |
          set -e

          mkdir -p toolchain

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            toolchain/gcc64

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            toolchain/gcc32

          echo "GCC toolchains downloaded."

      - name: Configure Kernel
        shell: bash
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -e
          cd kernel-source

          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export KBUILD_BUILD_USER="GitHub-Actions"
          export KBUILD_BUILD_HOST="Camellia-Builder"

          make O=out ARCH=arm64 "$DEFCONFIG"

          if [ ! -f out/.config ]; then
            echo "ERROR: Kernel .config was not generated!"
            exit 1
          fi

          # Verify requested KernelSU/SUSFS options.
          if grep -q '^CONFIG_KSU=y' out/.config; then
            echo "CONFIG_KSU is enabled."
          else
            echo "WARNING: CONFIG_KSU is not enabled in final config."
          fi

          if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
            echo "CONFIG_KSU_SUSFS is enabled."
          fi

      - name: Compile Kernel
        shell: bash
        run: |
          set -e
          cd kernel-source

          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          export HOSTLD=/usr/bin/ld
          export HOSTAR=/usr/bin/ar

          export KBUILD_BUILD_USER="GitHub-Actions"
          export KBUILD_BUILD_HOST="Camellia-Builder"

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            Image.gz-dtb

      - name: Prepare Kernel Image Artifact
        shell: bash
        run: |
          set -e

          cd kernel-source

          OUTPUT_DIR="$GITHUB_WORKSPACE/kernel-output"
          BOOT_DIR="out/arch/arm64/boot"

          mkdir -p "$OUTPUT_DIR"

          if [ -s "$BOOT_DIR/Image.gz-dtb" ]; then
            IMAGE="$BOOT_DIR/Image.gz-dtb"
            IMAGE_NAME="Image.gz-dtb"
          elif [ -s "$BOOT_DIR/Image.gz" ]; then
            IMAGE="$BOOT_DIR/Image.gz"
            IMAGE_NAME="Image.gz"
          elif [ -s "$BOOT_DIR/Image" ]; then
            IMAGE="$BOOT_DIR/Image"
            IMAGE_NAME="Image"
          else
            echo "ERROR: No valid kernel image found!"
            echo "Checked directory: $BOOT_DIR"
            ls -lah "$BOOT_DIR" || true
            exit 1
          fi

          cp "$IMAGE" "$OUTPUT_DIR/$IMAGE_NAME"

          echo "Kernel image prepared:"
          ls -lh "$OUTPUT_DIR/$IMAGE_NAME"

          file "$OUTPUT_DIR/$IMAGE_NAME"

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-Kernel-Image
          path: kernel-output/*
          if-no-files-found: error
          retention-days: 14
