
name: Build Kernel 4.14 (AOSP Clang / KernelSU-Next Legacy)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Target Defconfig"
        required: true
        default: "camellian_gl_base_defconfig"
        type: string

      build_type:
        description: "Kernel Build Type"
        required: true
        type: choice
        default: "KernelSU-Next"
        options:
          - Vanilla
          - KernelSU-Next

      kernel_dir:
        description: "Kernel Source Directory"
        required: true
        default: "camellian-t-oss"
        type: string

      jobs:
        description: "Build Jobs"
        required: true
        default: "4"
        type: string

env:
  KERNEL_REPO: https://github.com/noonomyen/camellian-linux.git
  KERNEL_BRANCH: master
  CLANG_VERSION: clang-r450784d
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            wget \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            device-tree-compiler

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            kernel-source

          KERNEL_DIR="$GITHUB_WORKSPACE/kernel-source/${{ inputs.kernel_dir }}"

          if [ ! -d "$KERNEL_DIR" ]; then
            echo "ERROR: Kernel directory not found!"
            echo "Expected: $KERNEL_DIR"
            exit 1
          fi

          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

      - name: Download AOSP Clang
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchains/aosp-clang"

          curl -L --retry 3 --fail \
            "$CLANG_URL" \
            -o "$GITHUB_WORKSPACE/clang.tar.gz"

          tar -xzf "$GITHUB_WORKSPACE/clang.tar.gz" \
            -C "$GITHUB_WORKSPACE/toolchains/aosp-clang"

          echo "$GITHUB_WORKSPACE/toolchains/aosp-clang/bin" >> "$GITHUB_PATH"

          echo "AOSP Clang:"
          "$GITHUB_WORKSPACE/toolchains/aosp-clang/bin/clang" --version

          echo "AOSP LLVM tools:"
          for tool in ld.lld llvm-ar llvm-nm llvm-objcopy \
                      llvm-objdump llvm-strip llvm-ranlib \
                      llvm-readelf; do
            test -x "$GITHUB_WORKSPACE/toolchains/aosp-clang/bin/$tool" \
              || {
                echo "Missing AOSP tool: $tool"
                exit 1
              }
          done

      - name: Setup KernelSU-Next Legacy
        if: inputs.build_type == 'KernelSU-Next'
        working-directory: ${{ github.workspace }}/kernel-source
        run: |
          cd "$KERNEL_DIR"

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

      - name: Configure Kernel
        run: |
          cd "$KERNEL_DIR"

          DEFCONFIG="${{ inputs.defconfig }}"
          OUT_DIR="$KERNEL_DIR/out"

          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "ERROR: Defconfig not found: $DEFCONFIG"
            exit 1
          fi

          mkdir -p "$OUT_DIR"

          make O="$OUT_DIR" \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            "$DEFCONFIG"

          if [ "${{ inputs.build_type }}" = "KernelSU-Next" ]; then
            chmod +x scripts/config

            scripts/config --file "$OUT_DIR/.config" \
              --enable KSU \
              --enable KPROBES \
              --enable KPROBE_EVENTS \
              --enable KSU_KPROBE_HOOKS

            make O="$OUT_DIR" \
              ARCH=arm64 \
              CC=clang \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              HOSTCC=clang \
              HOSTCXX=clang++ \
              HOSTLD=ld.lld \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              olddefconfig
          fi

          echo "========== Kernel Configuration =========="
          grep -E 'CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS)=' \
            "$OUT_DIR/.config" || true

      - name: Build Kernel
        run: |
          cd "$KERNEL_DIR"

          OUT_DIR="$KERNEL_DIR/out"
          JOBS="${{ inputs.jobs }}"

          echo "========== Build Information =========="
          echo "Kernel: $KERNEL_DIR"
          echo "Defconfig: ${{ inputs.defconfig }}"
          echo "Build Type: ${{ inputs.build_type }}"
          echo "Compiler: AOSP $CLANG_VERSION"
          echo "Jobs: $JOBS"

          COMMON_ARGS=(
            O="$OUT_DIR"
            ARCH=arm64
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            HOSTCC=clang
            HOSTCXX=clang++
            HOSTLD=ld.lld
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            LLVM_IAS=1
          )

          if grep -qE '^[[:space:]]*Image\.gz-dtb:' \
            arch/arm64/Makefile; then

            echo "Building Image.gz-dtb, DTBs and modules"

            make -j"$JOBS" "${COMMON_ARGS[@]}" \
              Image.gz-dtb dtbs modules

          else

            echo "Image.gz-dtb target unavailable."
            echo "Building Image.gz, DTBs and modules"

            make -j"$JOBS" "${COMMON_ARGS[@]}" \
              Image.gz dtbs modules
          fi

      - name: Collect Kernel Artifacts
        if: success()
        run: |
          cd "$KERNEL_DIR"

          OUT_DIR="$KERNEL_DIR/out"
          ARTIFACT_DIR="$GITHUB_WORKSPACE/kernel-artifacts"

          mkdir -p "$ARTIFACT_DIR"

          BOOT_DIR="$OUT_DIR/arch/arm64/boot"

          for file in Image Image.gz Image.gz-dtb; do
            if [ -f "$BOOT_DIR/$file" ]; then
              cp "$BOOT_DIR/$file" "$ARTIFACT_DIR/"
            fi
          done

          mkdir -p "$ARTIFACT_DIR/dtb"

          find "$BOOT_DIR" -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp --parents {} "$ARTIFACT_DIR/dtb/" \;

          mkdir -p "$ARTIFACT_DIR/modules"

          find "$OUT_DIR" -type f -name "*.ko" -print0 |
          while IFS= read -r -d '' file; do
            relative="${file#"$OUT_DIR"/}"
            mkdir -p "$ARTIFACT_DIR/modules/$(dirname "$relative")"
            cp "$file" "$ARTIFACT_DIR/modules/$relative"
          done

          echo "========== Artifacts =========="
          find "$ARTIFACT_DIR" -type f -printf '%P\n'

          if [ -z "$(find "$ARTIFACT_DIR" -type f -print -quit)" ]; then
            echo "ERROR: No kernel artifacts found!"
            exit 1
          fi

      - name: Upload Kernel Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-Kernel-${{ inputs.build_type }}-${{ github.run_number }}
          path: kernel-artifacts/
          if-no-files-found: error
          retention-days: 14
