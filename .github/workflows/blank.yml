
name: Build Kernel 4.14 (Vanilla / ReSuKISU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Target Defconfig File Name'
        required: true
        default: 'camellian_gl_defconfig'
      build_type:
        description: 'Pilih Tipe Build Kernel'
        required: true
        type: choice
        default: 'ReSuKISU'
        options:
          - Vanilla
          - ReSuKISU
      include_susfs:
        description: 'Gunakan SUSFS (Hanya Berlaku jika memilih ReSuKISU)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Build Name & ZIP
        id: set_name
        shell: bash
        run: |
          if [ "${{ inputs.build_type }}" = "ReSuKISU" ]; then
            if [ "${{ inputs.include_susfs }}" = "true" ]; then
              echo "ZIP_NAME=ReSuKISU-SUSFS-Kernel-4.14-Camellia.zip" >> "$GITHUB_ENV"
              echo "BUILD_TITLE=ReSuKISU + SUSFS" >> "$GITHUB_ENV"
            else
              echo "ZIP_NAME=ReSuKISU-Kernel-4.14-Camellia.zip" >> "$GITHUB_ENV"
              echo "BUILD_TITLE=ReSuKISU" >> "$GITHUB_ENV"
            fi
          else
            echo "ZIP_NAME=Vanilla-Kernel-4.14-Camellia.zip" >> "$GITHUB_ENV"
            echo "BUILD_TITLE=Vanilla Kernel" >> "$GITHUB_ENV"
          fi

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            bc \
            git \
            wget \
            curl \
            zip \
            dos2unix

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 \
            https://github.com/cristidclxvi/android_kernel_xiaomi_camellia \
            -b lineage-23.2 kernel-source

      - name: Setup ReSuKISU & SUSFS
        if: inputs.build_type == 'ReSuKISU'
        shell: bash
        run: |
          set -e
          cd kernel-source

          git clone --depth=1 \
            https://github.com/ReSukiSU/ReSukiSU.git KernelSU

          ln -sfn ../KernelSU/kernel drivers/KernelSU

          if ! grep -q "KernelSU" drivers/Makefile; then
            echo "obj-y += KernelSU/" >> drivers/Makefile
          fi

          cat <<'EOF' >> "arch/arm64/configs/${{ inputs.defconfig }}"
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          EOF

          if [ "${{ inputs.include_susfs }}" = "true" ]; then
            git clone --depth=1 \
              https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

            cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
            cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/

            cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h \
              include/linux/ 2>/dev/null || true

            cp ../susfs4ksu/kernel_patches/fs/sus_su.c \
              fs/ 2>/dev/null || true

            patch -p1 \
              < ../susfs4ksu/kernel_patches/50_recipe_for_4.14.patch || true

            cd KernelSU

            patch -p1 \
              < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true

            cd ..

            cat <<'EOF' >> "arch/arm64/configs/${{ inputs.defconfig }}"
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          fi

      - name: Download Proton-Clang Toolchain
        run: |
          mkdir -p toolchain/clang
          cd toolchain/clang
          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang.git .

      - name: Setup GCC Toolchain
        run: |
          cd toolchain

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

      - name: Compile Kernel
        shell: bash
        run: |
          set -e
          cd kernel-source

          export KBUILD_BUILD_USER="root"
          export KBUILD_BUILD_HOST="root"

          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"

          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          export HOSTLD=/usr/bin/ld
          export HOSTAR=/usr/bin/ar

          make O=out ARCH=arm64 "${{ inputs.defconfig }}"

          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Verify Kernel Image
        shell: bash
        run: |
          set -e

          cd kernel-source

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz-dtb" >> "$GITHUB_ENV"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz" >> "$GITHUB_ENV"
          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image" >> "$GITHUB_ENV"
          else
            echo "ERROR: Kernel image not found!"
            exit 1
          fi

      - name: Prepare Kernel Image Artifact
        shell: bash
        run: |
          set -e

          IMAGE_NAME="$(basename "$KERNEL_IMAGE")"
          cp "kernel-source/$KERNEL_IMAGE" "$GITHUB_WORKSPACE/$IMAGE_NAME"

          echo "KERNEL_ARTIFACT=$IMAGE_NAME" >> "$GITHUB_ENV"

          echo "Kernel image created successfully:"
          ls -lh "$GITHUB_WORKSPACE/$IMAGE_NAME"

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-Camellia
          path: ${{ env.KERNEL_ARTIFACT }}
          if-no-files-found: error
          retention-days: 14
