
name: Build Kernel 4.14 (Vanilla / KernelSU-Next + SUSFS)

on:
  workflow_dispatch:
    inputs:
      custom_source:
        description: "Custom Kernel Source URL"
        required: true
        default: "https://github.com/micode/xiaomi_kernel_opensource"

      custom_branch:
        description: "Custom Kernel Branch"
        required: true
        default: "camellian-t-oss"

      custom_dir:
        description: "Custom Kernel Directory"
        required: true
        default: "kernel-source/camellian-t-oss"

      defconfig:
        description: "Target Defconfig File Name"
        required: true
        default: "camellian_gl_defconfig"

      build_type:
        description: "Kernel Build Type"
        required: true
        type: choice
        options:
          - Vanilla
          - KernelSU-Next
        default: KernelSU-Next

      include_susfs:
        description: "Include SUSFS"
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Build Kernel 4.14
    runs-on: ubuntu-22.04

    env:
      KERNEL_SOURCE: ${{ inputs.custom_source }}
      KERNEL_BRANCH: ${{ inputs.custom_branch }}
      KERNEL_DIR: ${{ inputs.custom_dir }}
      DEFCONFIG: ${{ inputs.defconfig }}
      BUILD_TYPE: ${{ inputs.build_type }}
      INCLUDE_SUSFS: ${{ inputs.include_susfs }}

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget bc bison flex \
            build-essential zip unzip \
            libssl-dev libelf-dev \
            libncurses-dev dwarves \
            python3 python3-pip \
            lz4 zstd device-tree-compiler

      - name: Clone Custom Kernel Source
        run: |
          set -e

          git clone --recursive --depth=1 \
            -b "$KERNEL_BRANCH" \
            "$KERNEL_SOURCE" \
            "$KERNEL_DIR"

          echo "Kernel source: $KERNEL_SOURCE"
          echo "Kernel branch: $KERNEL_BRANCH"
          echo "Kernel directory: $KERNEL_DIR"

      - name: Setup Toolchains
        run: |
          set -e

          mkdir -p toolchain

          git clone --depth=1 \
            -b android12-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain/gcc64

          git clone --depth=1 \
            -b android12-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchain/gcc32

          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchain/clang

          CLANG_BIN="$(find "$GITHUB_WORKSPACE/toolchain/clang" \
            -type f -path '*/bin/clang' | head -n 1)"

          if [ -z "$CLANG_BIN" ]; then
            echo "::error::Clang binary not found"
            exit 1
          fi

          echo "CLANG_BIN=$(dirname "$CLANG_BIN")" >> "$GITHUB_ENV"

      - name: Setup KernelSU-Next
        if: inputs.build_type == 'KernelSU-Next'
        working-directory: ${{ inputs.custom_dir }}
        run: |
          set -e

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          CONFIG_FILE="arch/arm64/configs/$DEFCONFIG"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::Defconfig not found: $CONFIG_FILE"
            exit 1
          fi

          sed -i \
            -e '/^CONFIG_KSU=/d' \
            -e '/^CONFIG_KPROBES=/d' \
            -e '/^CONFIG_KPROBE_EVENTS=/d' \
            -e '/^CONFIG_KSU_KPROBE_HOOKS=/d' \
            "$CONFIG_FILE"

          cat >> "$CONFIG_FILE" <<'EOF'
          # KernelSU-Next
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_KPROBE_HOOKS=y
          EOF

      - name: Setup SUSFS
        if: inputs.include_susfs == true && inputs.build_type == 'KernelSU-Next'
        working-directory: ${{ inputs.custom_dir }}
        run: |
          set -e

          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            "$RUNNER_TEMP/susfs4ksu"

          SUSFS_DIR="$RUNNER_TEMP/susfs4ksu"

          PATCH_FILE="$(find "$SUSFS_DIR/kernel_patches" \
            -type f -iname '*4.14*.patch' | head -n 1)"

          KSU_PATCH="$(find "$SUSFS_DIR/kernel_patches" \
            -type f -path '*/KernelSU/*' \
            -iname '*susfs*.patch' | head -n 1)"

          if [ -z "$PATCH_FILE" ]; then
            echo "::error::SUSFS 4.14 patch not found"
            exit 1
          fi

          if [ -z "$KSU_PATCH" ]; then
            echo "::error::SUSFS KernelSU integration patch not found"
            exit 1
          fi

          cp "$SUSFS_DIR/kernel_patches/fs/susfs.c" fs/
          cp "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" include/linux/

          if [ -f "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" ]; then
            cp "$SUSFS_DIR/kernel_patches/include/linux/susfs_def.h" include/linux/
          fi

          patch --dry-run -p1 < "$PATCH_FILE"
          patch -p1 < "$PATCH_FILE"

          patch --dry-run -p1 < "$KSU_PATCH"
          patch -p1 < "$KSU_PATCH"

          CONFIG_FILE="arch/arm64/configs/$DEFCONFIG"

          cat >> "$CONFIG_FILE" <<'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF

      - name: Configure Kernel
        working-directory: ${{ inputs.custom_dir }}
        run: |
          set -e

          export PATH="$CLANG_BIN:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"

          export KBUILD_BUILD_USER="root"
          export KBUILD_BUILD_HOST="github-actions"

          make O=out ARCH=arm64 "$DEFCONFIG"

          if [ "$BUILD_TYPE" = "KernelSU-Next" ]; then
            grep -E \
              'CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_KPROBE_EVENTS=|CONFIG_KSU_KPROBE_HOOKS=' \
              out/.config
          fi

          if [ "$INCLUDE_SUSFS" = "true" ]; then
            grep 'CONFIG_KSU_SUSFS' out/.config
          fi

      - name: Build Kernel
        working-directory: ${{ inputs.custom_dir }}
        run: |
          set -e

          export PATH="$CLANG_BIN:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"

          export KBUILD_BUILD_USER="root"
          export KBUILD_BUILD_HOST="github-actions"

          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Collect Kernel Images
        working-directory: ${{ inputs.custom_dir }}
        run: |
          set -e

          OUT="$GITHUB_WORKSPACE/kernel-artifacts"
          mkdir -p "$OUT"

          BOOT="out/arch/arm64/boot"

          for FILE in Image Image.gz Image.gz-dtb; do
            if [ -f "$BOOT/$FILE" ]; then
              cp "$BOOT/$FILE" "$OUT/"
            fi
          done

          find "$BOOT" -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp --parents {} "$OUT/" \;

          if [ -z "$(find "$OUT" -type f -print -quit)" ]; then
            echo "::error::No kernel images found"
            exit 1
          fi

          find "$OUT" -type f -printf '%p %s bytes\n'

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-${{ inputs.build_type }}-${{ inputs.defconfig }}
          path: kernel-artifacts/
          if-no-files-found: error
          retention-days: 14
